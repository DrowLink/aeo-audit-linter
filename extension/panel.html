<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AEO DevTools Panel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      color: #f0f0f0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    button {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #0063b1; }
    #status { margin-top: 10px; color: #888; font-size: 0.9rem; }
    #results { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>AEO Linter - DevTools Panel</h1>
      <div id="status">Ready to audit current page</div>
    </div>
    <button id="run-audit-btn">Audit Page (AEO)</button>
  </div>
  <div id="results"></div>
  <script src="panel.js"></script>
</body>
</html>
