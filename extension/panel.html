<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEO Linter DevTools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1f242c;
      --surface-border: #30363d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --pass: #0cce6b;
      --average: #ffa400;
      --fail: #ff4e42;
      --accent: #58a6ff;
      --accent-hover: #388bfd;
      --btn-secondary: #21262d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation / Action Bar */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 1.25rem;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(88, 166, 255, 0.3);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--btn-secondary);
      color: var(--text);
      border-color: var(--surface-border);
    }
    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: #8b949e;
    }

    .btn-export {
      display: none;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
      flex: 1;
    }

    /* Empty / Drop Zone State */
    .dropzone-container {
      border: 2px dashed var(--surface-border);
      border-radius: 12px;
      background: var(--surface);
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 40px auto;
      max-width: 600px;
    }

    .dropzone-container:hover,
    .dropzone-container.drag-over {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.05);
    }

    .dropzone-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .dropzone-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .dropzone-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Report View */
    #report-content {
      display: none;
    }

    .report-header {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .report-url {
      font-size: 1.2rem;
      font-weight: 700;
      word-break: break-all;
    }

    .report-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Gauges Grid */
    .gauges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .gauge-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gauge-svg {
      width: 90px;
      height: 90px;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: #21262d;
      stroke-width: 8;
    }

    .gauge-fill {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }

    .gauge-score {
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: -62px;
      margin-bottom: 30px;
    }

    .gauge-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Category Section */
    .category-section {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .cat-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .cat-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .cat-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      max-width: 750px;
    }

    .cat-score-pill {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 16px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Audits List */
    .audits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .audit-card {
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      background: #0d1117;
      overflow: hidden;
    }

    .audit-summary {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      list-style: none;
      user-select: none;
    }

    .audit-summary::-webkit-details-marker { display: none; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .audit-name {
      flex: 1;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .audit-display-val {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 10px;
    }

    .audit-score-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .score-pass { background: rgba(12, 206, 107, 0.15); color: var(--pass); }
    .score-average { background: rgba(255, 164, 0, 0.15); color: var(--average); }
    .score-fail { background: rgba(255, 78, 66, 0.15); color: var(--fail); }
    .score-na { background: rgba(139, 148, 158, 0.15); color: var(--text-muted); }

    .status-dot.score-pass { background: var(--pass); }
    .status-dot.score-average { background: var(--average); }
    .status-dot.score-fail { background: var(--fail); }
    .status-dot.score-na { background: var(--text-muted); }

    .audit-body {
      padding: 14px 18px;
      border-top: 1px solid var(--surface-border);
      background: #090d13;
      font-size: 0.85rem;
    }

    .audit-desc {
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .audit-explanation {
      margin-bottom: 12px;
      color: #e6edf3;
    }

    /* Structured Tables */
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .details-table th {
      background: #161b22;
      color: var(--text-muted);
      text-align: left;
      padding: 6px 10px;
      border: 1px solid var(--surface-border);
    }

    .details-table td {
      padding: 6px 10px;
      border: 1px solid var(--surface-border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    .details-list {
      margin-left: 20px;
      color: #c9d1d9;
    }

    .details-list li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Action Bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">AEO Linter</span>
      <span class="brand-tag">DevTools</span>
    </div>

    <div class="actions">
      <!-- Hidden File Input for JSON Import -->
      <input type="file" id="import-file-input" accept=".json" style="display: none;">
      
      <button id="btn-import" class="btn-secondary" title="Import a previously saved JSON report">
        📥 Import JSON
      </button>
      <button id="btn-audit-page" class="btn-primary" title="Audit the currently opened tab in Chrome">
        ⚡ Audit Page
      </button>
      <button id="btn-export-json" class="btn-secondary btn-export" title="Export current report as JSON">
        💾 Export JSON
      </button>
    </div>
  </header>

  <!-- Content Area -->
  <main class="container">
    
    <!-- Empty / Dropzone State -->
    <div id="dropzone" class="dropzone-container">
      <div class="dropzone-icon">📊</div>
      <h2 class="dropzone-title">Audit Active Page or Import Report</h2>
      <p class="dropzone-desc">Click "Audit Page" to analyze the current tab, or drag and drop an AEO report <code>.json</code> file here to inspect it.</p>
      <button id="btn-dropzone-import" class="btn-secondary">
        📂 Select JSON Report File
      </button>
    </div>

    <!-- Report Dashboard View -->
    <div id="report-content">
      <!-- Dynamically filled by panel.js -->
    </div>

  </main>

  <script type="module" src="panel.js"></script>
</body>
</html>
