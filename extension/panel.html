<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEO & SEO Linter DevTools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --surface: rgba(16, 22, 36, 0.75);
      --surface-card: #121a2c;
      --surface-hover: rgba(26, 36, 58, 0.85);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-border-glow: rgba(99, 102, 241, 0.3);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --pass: #10b981;
      --pass-bg: rgba(16, 185, 129, 0.12);
      --pass-border: rgba(16, 185, 129, 0.25);
      
      --average: #f59e0b;
      --average-bg: rgba(245, 158, 11, 0.12);
      --average-border: rgba(245, 158, 11, 0.25);
      
      --fail: #f43f5e;
      --fail-bg: rgba(244, 63, 94, 0.12);
      --fail-border: rgba(244, 63, 94, 0.25);
      
      --accent: #6366f1;
      --accent-cyan: #38bdf8;
      --btn-grad: linear-gradient(135deg, #4f46e5 0%, #0284c7 100%);
      --btn-hover: linear-gradient(135deg, #4338ca 0%, #0369a1 100%);
      --glow-shadow: 0 8px 24px -6px rgba(79, 70, 229, 0.35);
      --cozy-radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 5% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 95% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation / Action Bar */
    .topbar {
      background: rgba(14, 20, 32, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      object-fit: cover;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tag {
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--btn-grad);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: var(--glow-shadow);
    }
    .btn-primary:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid var(--surface-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-export { display: none; }

    /* Summary Bar */
    .summary-metrics-bar {
      background: rgba(18, 26, 42, 0.95);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .headings-grid {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 3px 8px;
      min-width: 38px;
    }
    .metric-badge .lbl {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .metric-badge .val {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
    }

    .status-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-indexable {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--pass);
      font-weight: 700;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-noindex {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: var(--fail);
      font-weight: 700;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .quick-links {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }
    .quick-links a {
      color: var(--accent-cyan);
      text-decoration: none;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.4);
    }
    .quick-links a:hover {
      color: #ffffff;
      border-bottom-style: solid;
    }

    /* Tab Navigation */
    .tabs-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      padding: 0 20px;
      gap: 4px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 0;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.02);
    }
    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.05);
    }

    /* Main Container */
    .container {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 80px;
      flex: 1;
    }

    /* Empty / Drop Zone State */
    .dropzone-container {
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      padding: 50px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      margin: 40px auto;
      max-width: 600px;
    }

    .dropzone-container:hover,
    .dropzone-container.drag-over {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.06);
      transform: translateY(-2px);
    }

    .dropzone-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      font-size: 1.5rem;
    }

    .dropzone-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .dropzone-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Report View */
    #report-content {
      display: none;
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    /* Gauges Grid */
    .gauges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .gauge-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--cozy-radius);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .gauge-card:hover {
      transform: translateY(-2px);
      border-color: var(--surface-border-glow);
    }
    .gauge-card.gauge-main {
      border: 2px solid var(--accent);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(18, 24, 38, 0.85) 100%);
    }

    .gauge-svg {
      width: 84px;
      height: 84px;
      transform: rotate(-90deg);
    }
    .gauge-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 8; }
    .gauge-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .gauge-score {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: -58px;
      margin-bottom: 26px;
      font-family: 'JetBrains Mono', monospace;
    }
    .gauge-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    /* SERP Preview Card */
    .serp-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--cozy-radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .serp-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .serp-box {
      background: #ffffff;
      color: #202124;
      border-radius: 8px;
      padding: 14px 16px;
      font-family: Arial, sans-serif;
    }
    .serp-url { font-size: 0.78rem; color: #202124; margin-bottom: 3px; }
    .serp-title { font-size: 1.15rem; color: #1a0dab; text-decoration: none; display: block; margin-bottom: 4px; line-height: 1.3; }
    .serp-desc { font-size: 0.84rem; color: #4d5156; line-height: 1.4; }

    /* Top Keywords Table */
    .keywords-section {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--cozy-radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .keywords-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .keyword-row {
      display: grid;
      grid-template-columns: 140px 60px 70px 1fr;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.82rem;
    }
    .kw-word { font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .kw-count { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .kw-density { color: var(--accent-cyan); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .kw-bar-bg {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    .kw-bar-fill {
      background: linear-gradient(90deg, #38bdf8 0%, #6366f1 100%);
      height: 100%;
      border-radius: 999px;
    }

    /* Category Section */
    .category-section {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--cozy-radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .cat-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .cat-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
    .cat-desc { font-size: 0.82rem; color: var(--text-muted); }
    .cat-score-pill {
      font-size: 0.88rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Audits */
    .audits-list { display: flex; flex-direction: column; gap: 8px; }
    .audit-card {
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      background: var(--surface-card);
      overflow: hidden;
    }
    .audit-summary {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      list-style: none;
      user-select: none;
    }
    .audit-summary::-webkit-details-marker { display: none; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.score-pass { background: var(--pass); box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .status-dot.score-average { background: var(--average); box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .status-dot.score-fail { background: var(--fail); box-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }

    .audit-name { font-size: 0.86rem; font-weight: 600; flex: 1; }
    .audit-display-val { font-size: 0.78rem; color: var(--text-muted); margin-right: 8px; font-family: 'JetBrains Mono', monospace; }
    .audit-score-pill { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

    .score-pass { background: rgba(16, 185, 129, 0.15); color: var(--pass); }
    .score-average { background: rgba(245, 158, 11, 0.15); color: var(--average); }
    .score-fail { background: rgba(244, 63, 94, 0.15); color: var(--fail); }
    .score-na { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    .audit-body {
      padding: 12px 16px;
      border-top: 1px solid var(--surface-border);
      background: rgba(9, 13, 22, 0.7);
      font-size: 0.82rem;
    }
    .audit-desc { color: var(--text-muted); margin-bottom: 8px; }
    .audit-explanation { color: #cbd5e1; }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <img src="icons/icon48.png" class="brand-icon" alt="Logo">
      <span class="brand-title">AEO & SEO Linter</span>
      <span class="brand-tag">SEO + GEO + AEO</span>
    </div>
    <div class="actions">
      <input type="file" id="import-file-input" accept=".json" style="display: none;">
      <button class="btn-secondary" id="btn-import">📂 Import JSON</button>
      <button class="btn-secondary btn-export" id="btn-export-json">💾 Export JSON</button>
      <button class="btn-primary" id="btn-audit-page">⚡ Audit Active Tab</button>
    </div>
  </div>

  <!-- Summary Metrics Bar (rendered after audit) -->
  <div id="summary-bar-container"></div>

  <!-- Tabs Navigation (rendered after audit) -->
  <div id="tabs-nav-container"></div>

  <div class="container">
    <!-- Dropzone Empty State -->
    <div class="dropzone-container" id="dropzone">
      <div class="dropzone-icon">⚡</div>
      <h2 class="dropzone-title">Unified SEO, GEO & AEO Audit</h2>
      <p class="dropzone-desc">Click <strong>Audit Active Tab</strong> or drop an AEO/SEO <code>.json</code> report here to inspect technical SEO, RAG structured schemas, and direct answer density.</p>
      <button class="btn-primary" id="btn-dropzone-import">Select JSON File</button>
    </div>

    <!-- Report View Container -->
    <div id="report-content"></div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
